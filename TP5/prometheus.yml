# Configuration Prometheus - TP5
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alertes.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "serveurs"
    static_configs:
      - targets: ["srv-tp:9100", "web1:9100", "web2:9100"]
