# Bloc ajouté en TÊTE de /etc/ssh/sshd_config (avant la ligne Include)
# Durcissement SSH - TP2
# Place en debut de fichier car sshd garde la premiere valeur lue
PermitRootLogin no
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
AuthenticationMethods publickey
# Seule alice peut se connecter
AllowUsers alice
MaxAuthTries 3
LoginGraceTime 30
X11Forwarding no
