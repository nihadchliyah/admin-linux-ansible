# Configuration HAProxy - TP3
global
    log /dev/log local0
    log /dev/log local1 notice
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin
    user haproxy
    group haproxy
    daemon

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5s
    timeout client  30s
    timeout server  30s

# Point d'entree du site : port 80 de srv-tp
frontend web_front
    bind *:80
    default_backend web_back

# Repartition des requetes entre les deux serveurs web
backend web_back
    balance roundrobin
    option httpchk
    http-check send meth GET uri /
    server web1 192.168.56.11:80 check inter 2s fall 2 rise 2
    server web2 192.168.56.12:80 check inter 2s fall 2 rise 2

# Page de statistiques
listen stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 5s
