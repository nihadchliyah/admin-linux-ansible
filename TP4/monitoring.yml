---
# Installation des exporters Prometheus - TP5
- name: Installer node_exporter sur les serveurs web
  hosts: web
  become: true

  roles:
    - firewall

  tasks:
    - name: Installer prometheus-node-exporter
      ansible.builtin.apt:
        name: prometheus-node-exporter
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Demarrer et activer node_exporter
      ansible.builtin.service:
        name: prometheus-node-exporter
        state: started
        enabled: true
