---
# Installation de MariaDB pour la replication - TP3
- name: Installer et configurer MariaDB
  hosts: web
  become: true

  roles:
    - firewall

  tasks:
    - name: Installer MariaDB
      ansible.builtin.apt:
        name: mariadb-server
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Configurer la replication
      ansible.builtin.template:
        src: templates/replication.cnf.j2
        dest: /etc/mysql/mariadb.conf.d/60-replication.cnf
        mode: "0644"
      notify: Redemarrer MariaDB

    - name: Demarrer et activer MariaDB
      ansible.builtin.service:
        name: mariadb
        state: started
        enabled: true

  handlers:
    - name: Redemarrer MariaDB
      ansible.builtin.service:
        name: mariadb
        state: restarted
